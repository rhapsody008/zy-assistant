# Slack app manifest for zy-assistant. Create the app from this file, install it,
# then put the bot token (xoxb-), app-level token (xapp-, connections:write) and
# ZY's member id in the secret store. Socket mode: no request URL, nothing public.
display_information:
  name: zy-assistant
  description: Reminds ZY what the GitHub Project board says to do today.
  background_color: "#1f2d3d"
features:
  bot_user:
    display_name: zy-assistant
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  is_hosted: false
  token_rotation_enabled: false
