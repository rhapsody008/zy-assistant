apiVersion: apps/v1
kind: Deployment
metadata:
  name: zy-assistant
  labels:
    app.kubernetes.io/name: zy-assistant
spec:
  # One replica and it must stay one: the scheduler's SQLite state (what was
  # pinged, what ran) is per process, and Slack would get every ping twice.
  # Recreate so two pods never overlap on the ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zy-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zy-assistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Tag pinned in kustomization.yaml (images:).
          image: ghcr.io/rhapsody008/zy-assistant:0.3.0
          envFrom:
            # Created outside this repo: GITHUB_TOKEN, SLACK_BOT_TOKEN,
            # SLACK_APP_TOKEN, SLACK_USER_ID.
            - secretRef:
                name: zy-assistant-secrets
          env:
            - name: PROJECT_OWNER
              value: "rhapsody008"
            - name: PROJECT_NUMBER
              value: "1"
            - name: BRIEF_TIME
              value: "09:00"
            - name: EOD_TIME
              value: "17:30"
            - name: ASSISTANT_TZ
              value: "Asia/Singapore"
            - name: NOTES_REPO
              value: "rhapsody008/notes"
            - name: DB_PATH
              value: "/data/state.db"
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Liveness only: /healthz is 200 while the scheduler has ticked in the
          # last 5 minutes. No readiness probe, this pod serves no user traffic.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            # Node and SQLite want a writable /tmp; the root filesystem does not.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zy-assistant-data
        - name: tmp
          emptyDir: {}
